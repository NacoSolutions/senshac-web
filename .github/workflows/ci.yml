name: Placeholder contract

on:
  # Pull requests are the validation boundary; protected main consumes the
  # already-validated merge instead of running the same contract again.
  pull_request:
  workflow_dispatch:

concurrency:
  group: contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
      TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
    # Consumer pin: digest published by senshac-runner workflow 35397460307.
    container:
      image: ghcr.io/nacosolutions/senshac-runner@sha256:a950ccba03d922b18bd4f69f456fda39e3389760b539c96904b7f671d12c7055
    steps:
      - uses: actions/checkout@v4
      # The image entrypoint activates its Flox environment before job steps.
      # Consume the inherited PATH directly; the consumer must not require the
      # flox binary or install additional tools and browser packages here.
      - name: Verify inherited runner toolchain
        run: |
          set -euo pipefail
          command -v bun >/dev/null || {
            echo '::error::The pinned senshac-runner image did not expose bun on its inherited PATH.' >&2
            exit 1
          }
          echo "Inherited PATH: $PATH"
          bun --version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run deterministic quality gates
        run: bun run quality
      - name: Run browser smoke checks
        run: |
          set -euo pipefail
          if ! command -v chromium >/dev/null 2>&1; then
            echo '::error::The pinned senshac-runner image does not provide chromium; update the producer image digest before enabling browser smoke.' >&2
            exit 1
          fi
          export PLAYWRIGHT_CHROMIUM_PATH="$(command -v chromium)"
          bun run test:e2e
      - name: Validate repository contract
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -s AGENTS.md
          test -s README.md
          test -s .warren/config.yaml
          grep -q '^agentImage: ghcr.io/nacosolutions/senshac-warren-agent@sha256:' .warren/config.yaml
          test -s content/tina-fixture.json
          test -s content/tina-schema.json
          if find . -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' \) -not -path './.git/*' | grep -q .; then
            echo 'secret-like files are not allowed in the placeholder repository' >&2
            exit 1
          fi
