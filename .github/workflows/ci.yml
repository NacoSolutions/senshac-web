name: Placeholder contract

on:
  # Pull requests are the validation boundary; protected main consumes the
  # already-validated merge instead of running the same contract again.
  pull_request:
  workflow_dispatch:

concurrency:
  group: contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  contract:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nacosolutions/senshac-runner@sha256:b3d9afd406e541486225a9034d76d04e3c87cbfbc2d4b4ff471da8b130cce626
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # ubuntu-latest's workspace is owned by its runner user (UID 1001, GID 122).
      options: --user 1001:122
    env:
      HOME: /tmp
      TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
      TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
    steps:
      - name: Check out workflow revision
        env:
          CHECKOUT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)"
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" \
            -c "http.extraheader=AUTHORIZATION: basic ${auth_header}" \
            fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD
      - name: Verify web toolchain
        run: |
          set -euo pipefail
          command -v bun
          bun --version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run deterministic quality gates
        run: bun run quality
      - name: Verify runner Chromium
        run: |
          set -euo pipefail
          printf 'FONTCONFIG_FILE=%s\n' "${FONTCONFIG_FILE:-unset}"
          test -n "${FONTCONFIG_FILE:-}"
          test -f "$FONTCONFIG_FILE"
          fc-match sans-serif
          chromium --version
          echo "PLAYWRIGHT_CHROMIUM_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
      - name: Run browser smoke checks
        shell: bash
        run: |
          set +e
          bun run test:e2e
          result=$?
          if [ "$result" -ne 0 ]; then
            echo '--- Playwright test contexts ---'
            find test-results -name error-context.md -type f -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;
            echo '--- shared memory ---'
            df -h /dev/shm || true
            echo '--- container memory limit/events ---'
            cat /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.events 2>/dev/null || true
          fi
          exit "$result"
      - name: Validate repository contract
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -s AGENTS.md
          test -s README.md
          test -s .warren/config.yaml
          grep -q '^agentImage: ghcr.io/rogernavelsaker/warren-agent@sha256:e810f33eb23c5a5959d1209b5eb81b6c811f1aed97632f6abbfb4900b680b41f$' .warren/config.yaml
          test -s content/tina-fixture.json
          test -s content/tina-schema.json
          if find . -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' \) -not -path './.git/*' | grep -q .; then
            echo 'secret-like files are not allowed in the placeholder repository' >&2
            exit 1
          fi
