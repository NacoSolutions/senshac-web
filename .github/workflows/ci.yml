name: Web contract

on:
  # Pull requests are the validation boundary; protected main consumes the
  # already-validated merge instead of running the same contract again.
  pull_request:
  workflow_dispatch:

concurrency:
  group: contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  contract:
    container:
      image: ghcr.io/nacosolutions/senshac-runner@sha256:ee7d648ca019f01cca3ddafccf8cef0ac525aa5948f7cbd8ecfa04590dcf4fb6
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 1000:1000
    env:
      TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
      TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify web toolchain
        run: |
          set -euo pipefail
          command -v bun
          bun --version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run deterministic quality gates
        run: bun run quality
      - name: Verify runner Chromium
        run: |
          set -euo pipefail
          chromium --version
          echo "PLAYWRIGHT_CHROMIUM_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
      - name: Run browser smoke checks
        run: bun run test:e2e
      - name: Validate repository contract
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -s AGENTS.md
          test -s README.md
          test -s .warren/config.yaml
          grep -q '^agentImage: ghcr.io/nacosolutions/senshac-warren-agent@sha256:' .warren/config.yaml
          test -s content/tina-fixture.json
          test -s content/tina-schema.json
          if find . -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' \) -not -path './.git/*' | grep -q .; then
            echo 'secret-like files are not allowed in the placeholder repository' >&2
            exit 1
          fi
