name: Placeholder contract

on:
  # Pull requests are the validation boundary; protected main consumes the
  # already-validated merge instead of running the same contract again.
  pull_request:
  workflow_dispatch:

concurrency:
  group: contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
      TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # main now owns a devenv.nix rather than the producer's .flox project
      # lock, so the Flox runner image cannot activate this checkout. Use the
      # hosted toolchain explicitly instead of relying on an empty PATH.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - name: Verify web toolchain
        run: |
          set -euo pipefail
          command -v bun
          bun --version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run deterministic quality gates
        run: bun run quality
      - name: Install Chromium for browser smoke
        run: bunx playwright install --with-deps chromium
      - name: Run browser smoke checks
        run: bun run test:e2e
      - name: Validate repository contract
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test -s AGENTS.md
          test -s README.md
          test -s .warren/config.yaml
          grep -q '^agentImage: ghcr.io/nacosolutions/senshac-warren-agent@sha256:' .warren/config.yaml
          test -s content/tina-fixture.json
          test -s content/tina-schema.json
          if find . -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' \) -not -path './.git/*' | grep -q .; then
            echo 'secret-like files are not allowed in the placeholder repository' >&2
            exit 1
          fi
