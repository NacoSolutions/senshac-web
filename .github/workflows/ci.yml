name: Placeholder contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    # Consumer pin: digest published by senshac-runner workflow 35214744376.
    container:
      image: ghcr.io/nacosolutions/senshac-runner@sha256:681eb70b649ad6af34cc70b5abc1944276db015f17c73625423b3cbbc07421ab
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run deterministic quality gates
        run: npm run quality
      - name: Validate repository contract
        shell: bash
        run: |
          set -euo pipefail
          test -s AGENTS.md
          test -s README.md
          test -s .warren/config.yaml
          grep -q '^agentImage: ghcr.io/nacosolutions/senshac-warren-agent@sha256:' .warren/config.yaml
          test -s content/tina-fixture.json
          test -s content/tina-schema.json
          if find . -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' \) -not -path './.git/*' | grep -q .; then
            echo 'secret-like files are not allowed in the placeholder repository' >&2
            exit 1
          fi
          git diff --check
