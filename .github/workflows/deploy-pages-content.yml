name: Deploy Pages content revision

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [senshac-content-published]
  workflow_dispatch:
    inputs:
      content_revision:
        description: Full senshac-content commit SHA (empty resolves main)
        required: false
        type: string

concurrency:
  group: senshac-web-production-content-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out web source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Resolve immutable content revision
        id: content
        env:
          DISPATCH_REVISION: ${{ github.event.client_payload.content_sha }}
          MANUAL_REVISION: ${{ inputs.content_revision }}
        run: |
          set -euo pipefail
          revision="${DISPATCH_REVISION:-${MANUAL_REVISION:-}}"
          if [[ -z "$revision" ]]; then
            response=$(curl --fail-with-body --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              https://api.github.com/repos/NacoSolutions/senshac-content/commits/main)
            revision=$(jq -er '.sha' <<< "$response")
          fi
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          content_repo=$(mktemp -d)
          git -C "$content_repo" init --quiet
          git -C "$content_repo" remote add origin https://github.com/NacoSolutions/senshac-content.git
          git -C "$content_repo" fetch --quiet --no-tags origin main
          git -C "$content_repo" fetch --quiet --no-tags origin "$revision"
          git -C "$content_repo" merge-base --is-ancestor "$revision" origin/main
          web_revision=$(git rev-parse HEAD)
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
          printf 'web_revision=%s\n' "$web_revision" >> "$GITHUB_OUTPUT"
          echo "Publishing senshac-web@$web_revision with senshac-content@$revision"
          {
            printf '%s\n' '### Pages content deployment'
            printf -- '- Web source: %s\n' "$web_revision"
            printf -- '- Editorial content: senshac-content@%s\n' "$revision"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site from the exact content revision
        env:
          BUN_VERSION: '1.3.13'
          CF_PAGES: '1'
          ESBUILD_WORKER_THREADS: '0'
          PUBLIC_MEDIA_BASE_URL: https://media.senshac.com
          SENSHAC_CONTENT_REVISION: ${{ steps.content.outputs.revision }}
          SKIP_DEPENDENCY_INSTALL: '1'
          TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
        run: bun run build

      - name: Deploy production Pages artifact
        # Run outside the source checkout so Wrangler cannot attach Git commit metadata.
        # Cloudflare skips Git production deploys while production_deployments_enabled is false.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ runner.temp }}
        run: >-
          bunx --bun wrangler@4.129.0 pages deploy "$GITHUB_WORKSPACE/dist"
          --project-name senshac-web
          --branch main
          --skip-caching
