name: Deploy Pages content revision

on:
  # Cloudflare Pages owns source-push deployments. Keep this workflow for
  # immutable content-repo publish events and deliberate manual deployments.
  repository_dispatch:
    types: [senshac-content-published]
  workflow_dispatch:
    inputs:
      content_revision:
        description: Full senshac-content commit SHA (empty resolves main)
        required: false
        type: string

concurrency:
  group: senshac-web-production-content-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out web source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Resolve immutable content revision
        id: content
        env:
          DISPATCH_REVISION: ${{ github.event.client_payload.content_sha }}
          MANUAL_REVISION: ${{ inputs.content_revision }}
        run: |
          set -euo pipefail
          revision="${DISPATCH_REVISION:-${MANUAL_REVISION:-}}"
          if [[ -z "$revision" ]]; then
            response=$(curl --fail-with-body --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              https://api.github.com/repos/NacoSolutions/senshac-content/commits/main)
            revision=$(jq -er '.sha' <<< "$response")
          fi
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          content_repo=$(mktemp -d)
          git -C "$content_repo" init --quiet
          git -C "$content_repo" remote add origin https://github.com/NacoSolutions/senshac-content.git
          git -C "$content_repo" fetch --quiet --no-tags origin main
          git -C "$content_repo" fetch --quiet --no-tags origin "$revision"
          git -C "$content_repo" merge-base --is-ancestor "$revision" origin/main
          web_revision=$(git rev-parse HEAD)
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
          printf 'web_revision=%s\n' "$web_revision" >> "$GITHUB_OUTPUT"
          echo "Publishing senshac-web@$web_revision with senshac-content@$revision"
          {
            printf '%s\n' '### Pages content deployment'
            printf -- '- Web source: %s\n' "$web_revision"
            printf -- '- Editorial content: senshac-content@%s\n' "$revision"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          response_file=$(mktemp)
          http_status=$(curl --silent --show-error \
            --output "$response_file" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/senshac-web")
          if [[ "$http_status" != 200 ]] || ! jq -e \
            '.success == true and .result.name == "senshac-web"' \
            "$response_file" >/dev/null; then
            echo "Cloudflare Pages credential preflight failed for account $CLOUDFLARE_ACCOUNT_ID (HTTP $http_status)." >&2
            jq '{errors: [.errors[]? | {code, message}], messages: [.messages[]?.message]}' \
              "$response_file" >&2 || true
            exit 1
          fi
          echo "Cloudflare Pages credential preflight passed for senshac-web."

          upload_token_response=$(mktemp)
          upload_token_http_status=$(curl --silent --show-error \
            --output "$upload_token_response" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/senshac-web/upload-token")
          if [[ "$upload_token_http_status" != 200 ]] || ! jq -e \
            '.success == true and (.result.jwt | type == "string" and length > 0)' \
            "$upload_token_response" >/dev/null; then
            echo "Cloudflare Pages Write preflight failed for senshac-web (HTTP $upload_token_http_status). Grant Pages Write to CLOUDFLARE_API_TOKEN for this account/project." >&2
            jq '{errors: [.errors[]? | {code, message}], messages: [.messages[]?.message]}' \
              "$upload_token_response" >&2 || true
            exit 1
          fi
          echo "Cloudflare Pages Write preflight passed for senshac-web."

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site from the exact content revision
        env:
          BUN_VERSION: '1.3.13'
          CF_PAGES: '1'
          ESBUILD_WORKER_THREADS: '0'
          PUBLIC_MEDIA_BASE_URL: https://media.senshac.com
          SENSHAC_CONTENT_REVISION: ${{ steps.content.outputs.revision }}
          SKIP_DEPENDENCY_INSTALL: '1'
          TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
        run: bun run build

      - name: Deploy production Pages artifact
        # Stage the artifact outside the checkout; Wrangler derives Git metadata from its input path.
        # Cloudflare skips Git production deploys while production_deployments_enabled is false.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          artifact="$RUNNER_TEMP/pages-artifact"
          rm -rf "$artifact"
          cp -a "$GITHUB_WORKSPACE/dist" "$artifact"
          wrangler_log="$RUNNER_TEMP/wrangler.log"
          rm -f "$wrangler_log"
          if ! env -u GITHUB_ACTIONS -u GITHUB_SHA -u GITHUB_REF -u GITHUB_REF_NAME \
            -u GITHUB_HEAD_REF -u GITHUB_BASE_REF -u GITHUB_REPOSITORY -u CI \
            WRANGLER_LOG=debug WRANGLER_LOG_SANITIZE=true \
            WRANGLER_LOG_PATH="$wrangler_log" \
            npx --yes wrangler@4.129.0 pages deploy "$artifact" \
              --project-name senshac-web --branch main --skip-caching; then
            echo 'Sanitized Wrangler log tail:' >&2
            if [[ -f "$wrangler_log" ]]; then tail -n 120 "$wrangler_log" >&2; fi
            exit 1
          fi

          project=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/senshac-web")
          jq -e '
            .result.canonical_deployment as $d |
            $d.is_skipped == false and
            $d.deployment_trigger.type == "ad_hoc" and
            $d.latest_stage.status == "success"
          ' <<< "$project" >/dev/null
          jq -r '"Verified active Pages deployment: " + .result.canonical_deployment.short_id' <<< "$project"
